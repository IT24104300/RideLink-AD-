server:
  port: ${ACCOUNT_SERVER_PORT:8081}

spring:
  application:
    name: account-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${ACCOUNT_DB_URL:jdbc:h2:file:./data/account-db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
    username: ${ACCOUNT_DB_USER:sa}
    password: ${ACCOUNT_DB_PASSWORD:}
    driver-class-name: ${ACCOUNT_DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

ridelink:
  jwt:
    secret: ${JWT_SECRET:ridelink-dev-only-change-me-please-32chars-min}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
