server:
  port: ${FARE_SERVER_PORT:8084}

spring:
  application:
    name: fare-payment-service
  datasource:
    url: ${FARE_DB_URL:jdbc:h2:file:./data/fare-db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
    username: ${FARE_DB_USER:sa}
    password: ${FARE_DB_PASSWORD:}
    driver-class-name: ${FARE_DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

ridelink:
  jwt:
    secret: ${JWT_SECRET:ridelink-dev-only-change-me-please-32chars-min}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  fare:
    currency: LKR
    base: 150
    per-km: 80
    per-min: 5

springdoc:
  swagger-ui:
    path: /swagger-ui.html
