version: '3.8'

services:
  account-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        SERVICE_MODULE: account-service
    container_name: ridelink-account-service
    ports:
      - "8081:8081"
    environment:
      - ACCOUNT_SERVER_PORT=8081
      - JWT_SECRET=ridelink-dev-only-change-me-please-32chars-min
      - JWT_EXPIRATION_MS=86400000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ridelink-net

  driver-vehicle-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        SERVICE_MODULE: driver-vehicle-service
    container_name: ridelink-driver-vehicle-service
    ports:
      - "8082:8082"
    environment:
      - DRIVER_SERVER_PORT=8082
      - JWT_SECRET=ridelink-dev-only-change-me-please-32chars-min
      - JWT_EXPIRATION_MS=86400000
    depends_on:
      account-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ridelink-net

  fare-payment-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        SERVICE_MODULE: fare-payment-service
    container_name: ridelink-fare-payment-service
    ports:
      - "8084:8084"
    environment:
      - FARE_SERVER_PORT=8084
      - JWT_SECRET=ridelink-dev-only-change-me-please-32chars-min
      - JWT_EXPIRATION_MS=86400000
      - RIDE_SERVICE_URL=http://ride-service:8083
    depends_on:
      account-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ridelink-net

  ride-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        SERVICE_MODULE: ride-service
    container_name: ridelink-ride-service
    ports:
      - "8083:8083"
    environment:
      - RIDE_SERVER_PORT=8083
      - JWT_SECRET=ridelink-dev-only-change-me-please-32chars-min
      - JWT_EXPIRATION_MS=86400000
      - DRIVER_SERVICE_URL=http://driver-vehicle-service:8082
      - FARE_SERVICE_URL=http://fare-payment-service:8084
    depends_on:
      driver-vehicle-service:
        condition: service_healthy
      fare-payment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ridelink-net

networks:
  ridelink-net:
    name: ridelink-net
    driver: bridge
